
<!-- SARDAR KHAN & CO - INFINITE CONTACT BAR -->

<section
  class="relative w-full overflow-hidden border-y border-neutral-200 bg-white py-6 text-black">

  <div
    class="contact-marquee flex w-max items-center
           motion-reduce:animate-none
           hover:[animation-play-state:paused]">

    <!-- Repeat twice for a seamless loop -->
    @for (copy of [1, 2]; track copy) {

      <div
        class="flex shrink-0 items-center"
        [attr.aria-hidden]="copy === 2 ? 'true' : null">

        @for (phone of [
          '+924238001111',
          '+924236400240',
          '+924236400700',
          '+924236400600',
          '+923281999999'
        ]; track phone) {

          <a
            [href]="'tel:' + phone"
            class="flex shrink-0 items-center gap-3 px-8
                   text-[15px] font-semibold tracking-wide
                   text-black transition-opacity duration-300
                   hover:opacity-50 sm:text-[17px]">

            <!-- PHONE SVG -->
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="19"
              height="19"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true">

              <path
                d="M22 16.92v3a2 2 0 0 1-2.18 2
                   19.79 19.79 0 0 1-8.63-3.07
                   19.5 19.5 0 0 1-6-6
                   19.79 19.79 0 0 1-3.07-8.67
                   A2 2 0 0 1 4.11 2h3
                   a2 2 0 0 1 2 1.72
                   c.12.96.35 1.9.69 2.81
                   a2 2 0 0 1-.45 2.11
                   L8.09 9.91a16 16 0 0 0 6 6
                   l1.27-1.27a2 2 0 0 1 2.11-.45
                   c.91.34 1.85.57 2.81.69
                   A2 2 0 0 1 22 16.92z">
              </path>
            </svg>

            <span>{{ phone }}</span>

          </a>

          <!-- SEPARATOR -->
          <span
            class="h-1 w-1 shrink-0 rounded-full bg-neutral-400"
            aria-hidden="true">
          </span>

        }

      </div>

    }

  </div>

</section>
